spring:
     application:
          name: api-user
     boot:
          admin:
               client:
                    url: http://localhost:1111
                    instance:
                         metadata:
                              strategy: ${random.uuid}
     jackson:
          deserialization:
               fail-on-unknown-properties: true
          date-format: yyyy-MM-dd
     datasource:
          url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mpwcdb}
          username: ${SPRING_DATASOURCE_USERNAME:root}
          password: ${SPRING_DATASOURCE_PASSWORD:root}
          driver-class-name: com.mysql.cj.jdbc.Driver
          # url: "jdbc:mysql://localhost:3306/mpwcdb"
          # username: root
          # password: root
     jpa:
          show_sql: true
          hibernate:
               ddl-auto: update
          properties:
               hibernate:
                    dialect: org.hibernate.dialect.MySQL8Dialect

management:
     server:
          port: 8081
     endpoints:
          web:
               exposure:
                    include: "*"
     endpoint:
          health:
               show-details: always  
     

server:
     port: 8080
     address: 0.0.0.0
     forward-headers-strategy: framework