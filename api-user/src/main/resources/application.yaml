spring:
     application:
          name: api-user
     boot:
          admin:
               client:
                    url: http://localhost:1111
                    instance:
                         metadata:
                              strategy: ${random.uuid}
                         service-base-url: http://localhost:8081
     jackson:
          deserialization:
               fail-on-unknown-properties: true
          date-format: yyyy-MM-dd
     datasource:
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABSE:mpwcdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
               maximum-pool-size: 5
               minimum-idle: 1
               connection-timeout: 30000
               idle-timeout: 600000
               max-lifetime: 1800000
     jpa:
          show_sql: true
          hibernate:
               ddl-auto: update
          properties:
               hibernate:
                    dialect: org.hibernate.dialect.MySQLDialect
                    format-sql: true
     
management:
     server:
          port: 8080
     endpoints:
          web:
               exposure:
                    include: "*"
     endpoint:
          health:
               show-details: always  
     

server:
     port: 8081
     address: 0.0.0.0
     forward-headers-strategy: framework