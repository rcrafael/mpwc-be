spring:
     application:
          name: api-user
     jackson:
          deserialization:
               fail-on-unknown-properties: true
          date-format: yyyy-MM-dd
     datasource:
          url: "jdbc:mysql://localhost:3306/mpwcdb"
          username: root
          password: root
     jpa:
          show_sql: true
          hibernate:
               ddl-auto: update

server:
     port: 8081
     forward-headers-strategy: framework