spring:
     application:
          name: api-reports
     jackson:
          deserialization:
               fail-on-unknown-properties: true
          date-format: yyyy-MM-dd
     datasource:
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABSE:mpwcdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:root}
          driver-class-name: com.mysql.cj.jdbc.Driver
          hikari:
               maximum-pool-size: 5
               minimum-idle: 1
               connection-timeout: 30000
               idle-timeout: 600000
               max-lifetime: 1800000
     jpa:
          show_sql: true
          hibernate:
               ddl-auto: update
          properties:
               hibernate:
                    format-sql: true
     

server:
     port: 8085
     address: 0.0.0.0

management:
     server:
          port: 8085
     endpoints:
          web:
               exposure:
                    include: "*"