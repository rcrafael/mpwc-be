server:
     port: 8080
     address: 0.0.0.0

spring:
     cloud:
          gateway:
               routes:
                    - id: user-service-route
                      uri: ${USER_SERVICE:http://localhost:8081}
                      predicates:
                         - Path=/api/user/**
                    - id: customer-service-route
                      uri: ${USER_SERVICE:http://localhost:8081}
                      predicates:
                         - Path=/api/customer/**
                    - id: auth-service-route
                      uri: ${USER_SERVICE:http://localhost:8081}
                      predicates:
                         - Path=/api/auth/**
                    - id: auth-service-route
                      uri: ${USER_SERVICE:http://localhost:8081}
                      predicates:
                         - Path=/api/role/**
                    - id: payment-service-route
                      uri: ${PAYMENT_SERVICE:http://localhost:8082}
                      predicates:
                         - Path=/api/payment/**
                    - id: billing-service-route
                      uri: ${BILLING_SERVICE:http://localhost:8083}
                      predicates:
                         - Path=/api/billing/**
                    - id: settings-service-route
                      uri: ${SETTINGS_SERVICE:http://localhost:8084}
                      predicates:
                         - Path=/api/settings/**
                    - id: reports-service-route
                      uri: ${REPORTS_SERVICE:http://localhost:8085}
                      predicates:
                         - Path=/api/reports/**
               globalcors:
                    cors-configurations:
                         '[/**]':
                              allowedOrigins: "*"
                              allowedMethods: "*"
                              allowedHeaders: "*"
                              allowCredentials: false
                              exposed-headers: "Authorization"
                              max-age: 3600
management:
     server:
          port: 8080
     endpoints:
          web:
               exposure:
                    include: "*"