server:
     port: 8080

spring:
     cloud:
          gateway:
               routes:
                    - id: user-service-route
                      uri: http://localhost:8081
                      predicates:
                         - Path=/api/user/**
                    - id: customer-service-route
                      uri: http://localhost:8081
                      predicates:
                         - Path=/api/customer/**
                    - id: payment-service-route
                      uri: http://localhost:8082
                      predicates:
                         - Path=/api/payment/**
                    - id: billing-service-route
                      uri: http://localhost:8083
                      predicates:
                         - Path=/api/billing/**
               globalcors:
                    cors-configurations:
                         '[/**]':
                              allowedOrigins: "*"
                              allowedMethods: "*"
                              allowedHeaders: "*"
                              allowCredentials: "false"